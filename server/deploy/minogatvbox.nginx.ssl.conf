# Production config (HTTPS) — used once /etc/letsencrypt/live/minogatvbox.duckdns.org exists.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name minogatvbox.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/minogatvbox.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minogatvbox.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/minogatvbox-common.conf;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name minogatvbox.duckdns.org;

    # APK download also works over plain HTTP (old TV boxes / Downloader apps)
    include /etc/nginx/snippets/minogatvbox-common.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

