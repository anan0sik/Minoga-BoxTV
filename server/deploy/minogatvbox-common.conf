    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ── APK download (static files served directly by Nginx) ──
    location = /apk {
        return 302 /download/MinogaTVBox.apk;
    }

    location = /download/MinogaTVBox.apk {
        alias /var/www/minogatvbox/download/MinogaTVBox.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="MinogaTVBox.apk"';
        add_header Cache-Control "no-cache";
    }

    location = /download/version.json {
        alias /var/www/minogatvbox/download/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

