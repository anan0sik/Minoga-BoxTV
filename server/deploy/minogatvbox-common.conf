    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # ── APK download (tracked via backend + served directly by Nginx X-Accel-Redirect) ──
    location = /apk {
        return 302 /download/MinogaTVBox.apk;
    }

    location = /download/MinogaTVBox.apk {
        proxy_pass http://127.0.0.1:8091/api/downloads/file;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
    }

    location = /_internal_apk/MinogaTVBox.apk {
        internal;
        alias /var/www/minogatvbox/download/MinogaTVBox.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="MinogaTVBox.apk"';
        add_header Cache-Control "no-cache";
    }

    location = /download/version.json {
        alias /var/www/minogatvbox/download/version.json;
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /download/icon.png {
        alias /var/www/minogatvbox/download/icon.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }

    location /download/screenshots/ {
        alias /var/www/minogatvbox/download/screenshots/;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
    }
