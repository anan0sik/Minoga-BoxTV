[versions]
# Build toolchain
kotlin                  = "2.2.10"
agp                     = "9.4.1"
ksp                     = "2.3.6"

# AndroidX core
coreKtx                 = "1.15.0"
appcompat               = "1.7.0"
activityKtx             = "1.9.3"

# Jetpack Compose
composeBom              = "2024.12.01"
composeTv               = "1.0.0"
lifecycleRuntimeCompose = "2.8.7"
navigationCompose       = "2.8.5"
hiltNavigationCompose   = "1.2.0"

# Architecture
lifecycle               = "2.8.7"
room                    = "2.8.4"
hilt                    = "2.60.1"
datastore               = "1.1.2"
work                    = "2.10.0"
hiltWork                = "1.2.0"

# Networking
retrofit                = "2.11.0"
okhttpBom               = "4.12.0"
moshi                   = "1.15.1"

# Coroutines
coroutines              = "1.9.0"

# Media
media3                  = "1.5.1"

# Image loading
coil                    = "2.7.0"

# Testing
junit                   = "4.13.2"
junitExt                = "1.2.1"
espresso                = "3.6.1"
roomTesting             = "2.8.4"
coroutinesTesting       = "1.9.0"

[libraries]
# AndroidX Core
androidx-core-ktx               = { group = "androidx.core",         name = "core-ktx",              version.ref = "coreKtx" }
androidx-appcompat               = { group = "androidx.appcompat",    name = "appcompat",             version.ref = "appcompat" }
androidx-activity-ktx            = { group = "androidx.activity",     name = "activity-ktx",          version.ref = "activityKtx" }

# Jetpack Compose BOM (phone)
compose-bom                      = { group = "androidx.compose",      name = "compose-bom",           version.ref = "composeBom" }
compose-ui                       = { group = "androidx.compose.ui",   name = "ui" }
compose-ui-tooling               = { group = "androidx.compose.ui",   name = "ui-tooling" }
compose-ui-tooling-preview       = { group = "androidx.compose.ui",   name = "ui-tooling-preview" }
compose-material3                = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons           = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation                = { group = "androidx.compose.animation", name = "animation" }
compose-foundation               = { group = "androidx.compose.foundation", name = "foundation" }
compose-runtime                  = { group = "androidx.compose.runtime", name = "runtime" }

# Compose for TV
compose-tv-foundation            = { group = "androidx.tv",           name = "tv-foundation",         version.ref = "composeTv" }
compose-tv-material              = { group = "androidx.tv",           name = "tv-material",           version.ref = "composeTv" }

# Lifecycle
lifecycle-runtime-ktx            = { group = "androidx.lifecycle",    name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx          = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose        = { group = "androidx.lifecycle",    name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
lifecycle-viewmodel-compose      = { group = "androidx.lifecycle",    name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
navigation-compose               = { group = "androidx.navigation",   name = "navigation-compose",    version.ref = "navigationCompose" }

# Room
room-runtime                     = { group = "androidx.room",         name = "room-runtime",          version.ref = "room" }
room-ktx                         = { group = "androidx.room",         name = "room-ktx",              version.ref = "room" }
room-compiler                    = { group = "androidx.room",         name = "room-compiler",         version.ref = "room" }
room-testing                     = { group = "androidx.room",         name = "room-testing",          version.ref = "roomTesting" }

# Hilt
hilt-android                     = { group = "com.google.dagger",     name = "hilt-android",          version.ref = "hilt" }
hilt-compiler                    = { group = "com.google.dagger",     name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose          = { group = "androidx.hilt",         name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# DataStore
datastore-preferences            = { group = "androidx.datastore",    name = "datastore-preferences", version.ref = "datastore" }
work-runtime                     = { group = "androidx.work",          name = "work-runtime-ktx",      version.ref = "work" }
hilt-work                        = { group = "androidx.hilt",          name = "hilt-work",             version.ref = "hiltWork" }
androidx-hilt-compiler           = { group = "androidx.hilt",          name = "hilt-compiler",          version.ref = "hiltWork" }

# Networking
retrofit-core                    = { group = "com.squareup.retrofit2", name = "retrofit",              version.ref = "retrofit" }
retrofit-converter-moshi         = { group = "com.squareup.retrofit2", name = "converter-moshi",       version.ref = "retrofit" }
okhttp-bom                       = { group = "com.squareup.okhttp3",  name = "okhttp-bom",            version.ref = "okhttpBom" }
okhttp-core                      = { group = "com.squareup.okhttp3",  name = "okhttp" }
okhttp-logging                   = { group = "com.squareup.okhttp3",  name = "logging-interceptor" }
moshi-kotlin                     = { group = "com.squareup.moshi",    name = "moshi-kotlin",          version.ref = "moshi" }
moshi-codegen                    = { group = "com.squareup.moshi",    name = "moshi-kotlin-codegen",  version.ref = "moshi" }

# Coroutines
coroutines-android               = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTesting" }

# Media3 / ExoPlayer
media3-exoplayer                 = { group = "androidx.media3",       name = "media3-exoplayer",      version.ref = "media3" }
media3-exoplayer-hls             = { group = "androidx.media3",       name = "media3-exoplayer-hls",  version.ref = "media3" }
media3-exoplayer-dash            = { group = "androidx.media3",       name = "media3-exoplayer-dash", version.ref = "media3" }
media3-ui                        = { group = "androidx.media3",       name = "media3-ui",             version.ref = "media3" }
media3-session                   = { group = "androidx.media3",       name = "media3-session",        version.ref = "media3" }
media3-datasource-okhttp         = { group = "androidx.media3",       name = "media3-datasource-okhttp", version.ref = "media3" }
media3-cast                      = { group = "androidx.media3",       name = "media3-cast",           version.ref = "media3" }

# Image loading
coil-compose                     = { group = "io.coil-kt",            name = "coil-compose",          version.ref = "coil" }

# Testing
junit                            = { group = "junit",                 name = "junit",                 version.ref = "junit" }
junit-ext                        = { group = "androidx.test.ext",     name = "junit",                 version.ref = "junitExt" }
espresso                         = { group = "androidx.test.espresso", name = "espresso-core",        version.ref = "espresso" }


# For build-logic convention plugins
android-gradlePlugin               = { group = "com.android.tools.build", name = "gradle",              version.ref = "agp" }
kotlin-gradlePlugin                = { group = "org.jetbrains.kotlin",    name = "kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application     = { id = "com.android.application",           version.ref = "agp" }
android-library         = { id = "com.android.library",               version.ref = "agp" }
kotlin-android          = { id = "org.jetbrains.kotlin.android",      version.ref = "kotlin" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm",          version.ref = "kotlin" }
ksp                     = { id = "com.google.devtools.ksp",           version.ref = "ksp" }
hilt                    = { id = "com.google.dagger.hilt.android",    version.ref = "hilt" }
compose-compiler        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[bundles]
compose-phone = [
    "compose-ui",
    "compose-material3",
    "compose-animation",
    "compose-foundation",
    "compose-runtime",
    "compose-material-icons",
    "compose-ui-tooling-preview",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
]
compose-tv = [
    "compose-tv-foundation",
    "compose-tv-material",
    "compose-animation",
    "compose-foundation",
    "compose-runtime",
    "lifecycle-runtime-compose",
    "lifecycle-viewmodel-compose",
]
media3 = [
    "media3-exoplayer",
    "media3-exoplayer-hls",
    "media3-exoplayer-dash",
    "media3-ui",
    "media3-session",
    "media3-datasource-okhttp",
]
networking = [
    "retrofit-core",
    "retrofit-converter-moshi",
    "okhttp-core",
    "okhttp-logging",
    "moshi-kotlin",
]
